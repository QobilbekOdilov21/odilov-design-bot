name: "ODILOV — Set Telegram webhook"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register-webhook:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      WEBHOOK_URL: https://odilov-design-bot.qobilbekodilov21.workers.dev/webhook
    steps:
      - name: Configure and verify Telegram webhook
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { BOT_TOKEN, WEBHOOK_SECRET, WEBHOOK_URL } = process.env;

          if (!/^\d+:[A-Za-z0-9_-]{25,}$/.test(BOT_TOKEN || '')) {
            throw Error('BOT_TOKEN GitHub Actions secret is missing or invalid.');
          }
          if (!/^[A-Za-z0-9_-]{32,256}$/.test(WEBHOOK_SECRET || '')) {
            throw Error('WEBHOOK_SECRET GitHub Actions secret must contain 32–256 letters/numbers/_/-.');
          }
          if (new URL(WEBHOOK_URL).protocol !== 'https:') {
            throw Error('Webhook URL must use HTTPS.');
          }

          const api = async (method, body) => {
            const response = await fetch(
              'https://api.telegram.org/bot' + BOT_TOKEN + '/' + method,
              {
                ...(body ? {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(body),
                } : {}),
                signal: AbortSignal.timeout(25000),
              },
            );
            const data = await response.json();
            if (!response.ok || !data.ok) {
              // Do not print raw request URLs or API responses: they may contain secrets.
              throw Error('Telegram ' + method + ' failed, HTTP ' + response.status);
            }
            return data.result;
          };

          await api('setWebhook', {
            url: WEBHOOK_URL,
            secret_token: WEBHOOK_SECRET,
            allowed_updates: ['message', 'callback_query', 'channel_post'],
            drop_pending_updates: false,
          });
          const info = await api('getWebhookInfo');
          if (info.url !== WEBHOOK_URL) throw Error('Webhook URL verification failed.');
          console.log('Webhook is configured and verified at:', info.url);
          console.log('Pending Telegram updates:', info.pending_update_count);
          NODE
