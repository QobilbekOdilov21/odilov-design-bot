# ODILOV STUDIO Telegram order bot
# Creates a paid, always-on Render background worker with persistent SQLite storage.
# Review the monthly cost in Render before applying this Blueprint.
services:
  - type: worker
    name: odilov-design-bot
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    dockerfilePath: ./Dockerfile
    disk:
      name: odilov-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PORTFOLIO_URL
        sync: false
      - key: MANAGER_USERNAME
        sync: false
      - key: DATABASE_PATH
        value: /data/odilov.db
      - key: TIMEZONE
        value: Asia/Tashkent
